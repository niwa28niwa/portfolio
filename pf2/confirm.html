<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入力内容の確認 | 山川森林組合</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ヘッダー（ロゴエリア） -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <span class="logo-icon"></span>
                <span class="logo-text">山川森林組合</span>
            </a>
        </div>
    </header>

    <main class="form-page">
        <div class="form-container">

            <div class="form-header">
                <h1>入力内容の確認</h1>
                <p>以下の内容で間違いがなければ、「この内容で送信する」ボタンを押してください。</p>
            </div>

            <div class="confirm-list">

                <div class="confirm-item">
                    <span class="confirm-label">お問い合わせ内容</span>
                    <!-- id="view-type" を追加、中身を空に -->
                    <span class="confirm-value" id="view-type"></span>
                </div>

                <div class="confirm-item">
                    <span class="confirm-label">お名前</span>
                    <!-- id="view-name" を追加、中身を空に -->
                    <span class="confirm-value" id="view-name"></span>
                </div>

                <div class="confirm-item">
                    <span class="confirm-label">フリガナ</span>
                    <!-- id="view-kana" を追加、中身を空に -->
                    <span class="confirm-value" id="view-kana"></span>
                </div>

                <div class="confirm-item">
                    <span class="confirm-label">メールアドレス</span>
                    <!-- id="view-email" を追加、中身を空に -->
                    <span class="confirm-value" id="view-email"></span>
                </div>

                <div class="confirm-item">
                    <span class="confirm-label">電話番号</span>
                    <!-- id="view-tel" を追加、中身を空に -->
                    <span class="confirm-value" id="view-tel"></span>
                </div>

                <div class="confirm-item">
                    <span class="confirm-label">希望する働き方</span>
                    <!-- id="view-job" を追加、中身を空に -->
                    <span class="confirm-value" id="view-job"></span>
                </div>

                <div class="confirm-item col-block">
                    <span class="confirm-label">ご質問・ご要望など</span>
                    <!-- id="view-message" を追加、中身を空に -->
                    <span class="confirm-value" id="view-message"></span>
                </div>

            </div>

            <!-- アクションボタン -->
            <div class="confirm-buttons">
                <a href="contact.html" class="btn-back">修正する</a>
                <a href="thanks.html" class="btn btn-accent btn-submit-action">この内容で送信する</a>
            </div>

        </div>
    </main>

    <!-- トップに戻るボタン -->
    <a href="#" class="to-top-btn" aria-label="ページトップへ戻る"></a>
    <!-- 既存のコード（トップに戻るボタンなど）の下に追加してください -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 1. URLの「?」以降のパラメータ（データ）を取得
            const queryParams = new URLSearchParams(window.location.search);

            // 2. ラジオボタンの値（英単語）を、日本語の表示名に変換するマップ
            const typeMapping = {
                'material': '資料請求（パンフレット送付）',
                'consult': '説明会・個別相談の希望',
                'question': 'その他のお問い合わせ'
            };

            // 3. セレクトボックスの値（英単語）を、日本語の表示名に変換するマップ
            const jobMapping = {
                'field': '現場職（伐採・植林など山での作業）',
                'office': '管理・事務職（森林調査、山主対応、図面作成など）',
                'undecided': 'まだ決まっていない（相談したい）'
            };

            // 4. 各データをURLから取得（input側のname属性と一致）
            const typeCode = queryParams.get('type');
            const name = queryParams.get('name');
            const kana = queryParams.get('kana');
            const email = queryParams.get('email');
            const tel = queryParams.get('tel');
            const jobCode = queryParams.get('job-type');
            const message = queryParams.get('message');

            // 5. 取得した値を確認ページの各要素（id）に反映
            // ※「|| 'ー'」は、任意項目が空欄だった場合に「ー」と表示させるための記述です。

            if (document.getElementById('view-type')) {
                document.getElementById('view-type').textContent = typeMapping[typeCode] || '未選択';
            }
            if (document.getElementById('view-name')) {
                document.getElementById('view-name').textContent = name || '未入力';
            }
            if (document.getElementById('view-kana')) {
                document.getElementById('view-kana').textContent = kana || '未入力';
            }
            if (document.getElementById('view-email')) {
                document.getElementById('view-email').textContent = email || '未入力';
            }
            if (document.getElementById('view-tel')) {
                document.getElementById('view-tel').textContent = tel || 'ー';
            }
            if (document.getElementById('view-job')) {
                document.getElementById('view-job').textContent = jobMapping[jobCode] || 'ー';
            }
            if (document.getElementById('view-message')) {
                if (message) {
                    // 改行やスペースの崩れを防ぎ、安全にテキストを反映
                    document.getElementById('view-message').textContent = message;
                    // 改行コード（\n）をブラウザ表示用の改行（white-space）で表現するため、CSSを1行付与
                    document.getElementById('view-message').style.whiteSpace = 'pre-wrap';
                } else {
                    document.getElementById('view-message').textContent = 'ー';
                }
            }
        });
    </script>
</body>

</body>

</html>
