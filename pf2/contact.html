<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料請求・お問い合わせ | 森林組合 採用特設サイト</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ヘッダー（ロゴエリア） -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <span class="logo-icon"></span>
                <span class="logo-text">山川森林組合</span>
            </a>
        </div>
    </header>


    <!-- フォーム専用のコンテナ -->
    <main class="form-page">
        <div class="form-container">

            <div class="form-header">
                <p style="color: #2D5A27; font-weight: bold; margin-bottom: 5px;">山川森林組合</p>
                <h1>資料請求・お問い合わせ</h1>

                <p>林業への第一歩を応援します。パンフレットの送付や、採用に関するご質問、個別相談のご希望など、お気軽に入力してください。</p>
            </div>

            <form action="confirm.html" method="get" class="main-form">

            <!-- お問い合わせ種別（ラジオボタン） -->
            <div class="form-group">
                <label class="form-label">お問い合わせ内容 <span class="badge-required">必須</span></label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="type" value="material" checked> 資料請求（パンフレット送付）
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="type" value="consult"> 説明会・個別相談の希望
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="type" value="question"> その他のお問い合わせ
                    </label>
                </div>
            </div>

            <!-- 氏名 -->
            <div class="form-group">
                <label for="name" class="form-label">お名前 <span class="badge-required">必須</span></label>
                <input type="text" id="name" name="name" placeholder="例：森林 太郎" required class="form-input">
                <p id="name-error" class="error-msg"></p>
            </div>

            <!-- フリガナ -->
            <div class="form-group">
                <label for="kana" class="form-label">フリガナ <span class="badge-required">必須</span></label>
                <input type="text" id="kana" name="kana" placeholder="例：シンリン タロウ" required class="form-input">
                <p id="kana-error" class="error-msg"></p>
            </div>

            <!-- メールアドレス -->
            <div class="form-group">
                <label for="email" class="form-label">メールアドレス <span class="badge-required">必須</span></label>
                <input type="email" id="email" name="email" placeholder="例：example@forest.or.jp" required
                    class="form-input">
                <p id="email-error" class="error-msg"></p>
            </div>

            <!-- 電話番号 -->
            <div class="form-group">
                <label for="tel" class="form-label">電話番号 <span class="badge-optional">任意</span></label>
                <input type="tel" id="tel" name="tel" placeholder="例：09012345678" class="form-input">
            </div>

            <!-- 希望する働き方（セレクトボックス） -->
            <div class="form-group">
                <label for="job-type" class="form-label">希望する働き方（現時点のイメージ） <span
                        class="badge-optional">任意</span></label>
                <select id="job-type" name="job-type" class="form-input">
                    <option value="">選択してください</option>
                    <option value="field">現場職（伐採・植林など山での作業）</option>
                    <option value="office">管理・事務職（森林調査、山主対応、図面作成など）</option>
                    <option value="undecided">まだ決まっていない（相談したい）</option>
                </select>
            </div>

            <!-- メッセージ -->
            <div class="form-group">
                <label for="message" class="form-label">ご質問・ご要望など <span class="badge-optional">任意</span></label>
                <textarea id="message" name="message" rows="6" placeholder="現在の状況や、確認したいことなどをご自由に入力してください。"
                    class="form-input rows-textarea"></textarea>
            </div>

            <!-- 送信ボタン -->
            <div class="form-submit">
                <button type="submit" class="btn btn-accent form-btn">入力内容を確認する</button>
            </div>

            </form>

            <!-- トップページに戻るリンク -->
            <div class="form-back">
                <a href="index.html">← 特設サイトトップへ戻る</a>
            </div>

        </div>
    </main>
    <!-- トップに戻るボタン -->
    <a href="#" class="to-top-btn" aria-label="ページトップへ戻る"></a>
    <script src="script.js"></script>
</body>

</html>
